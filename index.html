<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Generator</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --border-color: #e2e8f0;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --highlight-bg: #e0f2fe;
      --highlight-border: #38bdf8;
      --highlight-mid-bg: #f0f9ff;
      --pill-bg: #f1f5f9;
      --pill-text: #334155;
      --pill-selected-bg: #0284c7;
      --pill-selected-text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.5;
      padding: 1.5rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ヘッダーエリア */
    .app-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid var(--border-color);
    }

    .app-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .json-loader {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .json-loader input {
      padding: 0.4rem 0.6rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.85rem;
      width: 280px;
    }

    /* アコーディオン・階層構造 */
    .accordion-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    details {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      transition: border-color 0.2s, background-color 0.2s, box-shadow 0.2s;
    }

    summary {
      padding: 0.75rem 1rem;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      user-select: none;
      background-color: var(--card-bg);
      transition: background-color 0.2s;
    }

    summary:hover {
      background-color: #f1f5f9;
    }

    /* ★ 選択項目がある場合のハイライトスタイル ★ */
    /* 大分類（祖父） */
    details.top-category.has-selected {
      border: 2px solid var(--highlight-border);
      box-shadow: 0 4px 6px -1px rgba(56, 189, 248, 0.15);
    }
    details.top-category.has-selected > summary {
      background-color: var(--highlight-bg);
      color: #0369a1;
      font-weight: 700;
    }

    /* 中分類（親） */
    details.mid-category {
      margin: 0.5rem 1rem 0.75rem 1rem;
      border: 1px solid var(--border-color);
    }
    details.mid-category.has-selected {
      border-left: 4px solid var(--primary);
    }
    details.mid-category.has-selected > summary {
      background-color: var(--highlight-mid-bg);
      color: var(--primary);
      font-weight: 700;
    }

    /* 選択件数バッジ */
    .badge-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: var(--primary);
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: 9999px;
      min-width: 1.25rem;
      height: 1.25rem;
      padding: 0 0.4rem;
      margin-left: 0.5rem;
    }

    /* 小分類＆ピル要素 */
    .low-category-block {
      padding: 0.5rem 1rem 1rem 1rem;
    }

    .low-category-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-sub);
      margin: 0.5rem 0 0.4rem 0;
    }

    .pills-container {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .pill {
      background: var(--pill-bg);
      color: var(--pill-text);
      padding: 0.3rem 0.7rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      cursor: pointer;
      border: 1px solid transparent;
      user-select: none;
      transition: all 0.15s ease-in-out;
    }

    .pill:hover {
      background: #e2e8f0;
    }

    .pill.selected {
      background: var(--pill-selected-bg);
      color: var(--pill-selected-text);
      font-weight: 600;
      box-shadow: 0 2px 4px rgba(2, 132, 199, 0.25);
    }

    /* 出力エリア */
    .output-section {
      background: var(--card-bg);
      padding: 1.5rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .output-header {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .actions {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    button {
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
      flex: 2;
      min-width: 180px;
    }
    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: #f1f5f9;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      flex: 1;
      min-width: 120px;
    }
    .btn-secondary:hover {
      background-color: #e2e8f0;
    }

    .textarea-group {
      margin-top: 1rem;
    }

    .textarea-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 0.25rem;
      display: block;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 0.75rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.9rem;
      resize: vertical;
      background: #fafafa;
      color: var(--text-main);
      margin-bottom: 1rem;
    }

    /* メッセージ通知 */
    #status-msg {
      font-size: 0.85rem;
      padding: 0.5rem;
      border-radius: 4px;
      display: none;
      margin-bottom: 1rem;
    }
    #status-msg.error {
      display: block;
      background: #fee2e2;
      color: #b91c1c;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- ヘッダー -->
    <header class="app-header">
      <div class="app-title">🎨 Prompt Generator</div>
      <div class="json-loader">
        <input type="text" id="json-url" value="prompts.json" placeholder="JSONのパスまたはRaw URL">
        <button class="btn-secondary" onclick="fetchAndRenderJSON()">再読込</button>
      </div>
    </header>

    <div id="status-msg"></div>

    <!-- 項目選択エリア -->
    <section>
      <h2 style="font-size: 1.1rem; margin-bottom: 0.75rem;">🔍 項目を選択</h2>
      <div id="accordion-root" class="accordion-group">
        <!-- JSで動的生成 -->
      </div>
    </section>

    <!-- 生成結果エリア -->
    <section class="output-section">
      <div class="output-header">📄 生成結果</div>
      
      <div class="actions">
        <button class="btn-primary" onclick="generatePrompts()">🚀 プロンプトを作成する</button>
        <button class="btn-secondary" onclick="resetAll()">♻️ 選択をリセット</button>
        <button class="btn-secondary" onclick="clearOutput()">🗑️ 表示をクリア</button>
      </div>

      <div class="textarea-group">
        <label class="textarea-label">DomoAI Prompt Output</label>
        <textarea id="output-domo" readonly placeholder="ボタンを押すとここにプロンプトが生成されます"></textarea>
      </div>

      <div class="textarea-group">
        <label class="textarea-label">Gemini Prompt Output</label>
        <textarea id="output-gem" readonly placeholder="ボタンを押すとここにプロンプトが生成されます"></textarea>
      </div>
    </section>
  </div>

  <script>
    let jsonData = {};

    // 1. JSON読み込みと初期化（キャッシュ無効化クエリ付き）
    async function fetchAndRenderJSON() {
      const urlInput = document.getElementById('json-url').value.trim();
      const statusMsg = document.getElementById('status-msg');
      statusMsg.style.display = 'none';

      // GitHub更新直後のキャッシュ対策としてタイムスタンプを付加
      const cacheBustUrl = urlInput.includes('?') 
        ? `${urlInput}&_t=${new Date().getTime()}` 
        : `${urlInput}?_t=${new Date().getTime()}`;

      try {
        const response = await fetch(cacheBustUrl);
        if (!response.ok) {
          throw new Error(`HTTPエラー: ステータス ${response.status}`);
        }
        jsonData = await response.json();
        renderUI(jsonData);
      } catch (err) {
        statusMsg.textContent = `JSONの読み込みに失敗しました: ${err.message}`;
        statusMsg.className = 'error';
        document.getElementById('accordion-root').innerHTML = '';
      }
    }

    // 2. UIの動的構築
    function renderUI(data) {
      const root = document.getElementById('accordion-root');
      root.innerHTML = '';

      for (const [topCat, midData] of Object.entries(data)) {
        const topDetails = document.createElement('details');
        topDetails.className = 'top-category';

        const topSummary = document.createElement('summary');
        topSummary.innerHTML = `<span>📂 ${topCat}</span>`;
        topDetails.appendChild(topSummary);

        for (const [midCat, lowData] of Object.entries(midData)) {
          const midDetails = document.createElement('details');
          midDetails.className = 'mid-category';

          const midSummary = document.createElement('summary');
          midSummary.innerHTML = `<span>🔹 ${midCat}</span>`;
          midDetails.appendChild(midSummary);

          for (const [lowCat, items] of Object.entries(lowData)) {
            if (!Array.isArray(items) || items.length === 0) continue;

            const block = document.createElement('div');
            block.className = 'low-category-block';

            const title = document.createElement('div');
            title.className = 'low-category-title';
            title.textContent = lowCat;
            block.appendChild(title);

            const pillsWrap = document.createElement('div');
            pillsWrap.className = 'pills-container';

            items.forEach(item => {
              const pill = document.createElement('span');
              pill.className = 'pill';
              pill.textContent = item.name;
              pill.dataset.value = item.value;

              pill.addEventListener('click', () => {
                pill.classList.toggle('selected');
                updateCategoryHighlights();
              });

              pillsWrap.appendChild(pill);
            });

            block.appendChild(pillsWrap);
            midDetails.appendChild(block);
          }

          topDetails.appendChild(midDetails);
        }

        root.appendChild(topDetails);
      }
    }

    // 3. 親・祖父階層のハイライトと件数バッジの更新
    function updateCategoryHighlights() {
      // 大分類を走査
      document.querySelectorAll('.top-category').forEach(topEl => {
        const topSelectedCount = topEl.querySelectorAll('.pill.selected').length;
        const topSummary = topEl.querySelector('summary');

        if (topSelectedCount > 0) {
          topEl.classList.add('has-selected');
          updateBadge(topSummary, topSelectedCount);
        } else {
          topEl.classList.remove('has-selected');
          removeBadge(topSummary);
        }

        // 中分類を走査
        topEl.querySelectorAll('.mid-category').forEach(midEl => {
          const midSelectedCount = midEl.querySelectorAll('.pill.selected').length;
          const midSummary = midEl.querySelector('summary');

          if (midSelectedCount > 0) {
            midEl.classList.add('has-selected');
            updateBadge(midSummary, midSelectedCount);
          } else {
            midEl.classList.remove('has-selected');
            removeBadge(midSummary);
          }
        });
      });
    }

    function updateBadge(summaryEl, count) {
      if (!summaryEl) return;
      let badge = summaryEl.querySelector('.badge-count');
      if (!badge) {
        badge = document.createElement('span');
        badge.className = 'badge-count';
        summaryEl.appendChild(badge);
      }
      badge.textContent = count;
    }

    function removeBadge(summaryEl) {
      if (!summaryEl) return;
      const badge = summaryEl.querySelector('.badge-count');
      if (badge) {
        badge.remove();
      }
    }

    // 4. プロンプト生成
    function generatePrompts() {
      const selectedPills = document.querySelectorAll('.pill.selected');
      const values = Array.from(selectedPills).map(p => p.dataset.value);
      const combined = values.join('');

      const prefix = "かわいいアニメイラスト. 9:16, ";
      
      document.getElementById('output-domo').value = combined;
      document.getElementById('output-gem').value = combined ? `${prefix}${combined}` : '';
    }

    // 5. リセットとクリア
    function resetAll() {
      document.querySelectorAll('.pill.selected').forEach(p => p.classList.remove('selected'));
      updateCategoryHighlights();
      document.getElementById('output-domo').value = '';
      document.getElementById('output-gem').value = '';
    }

    function clearOutput() {
      document.getElementById('output-domo').value = '';
      document.getElementById('output-gem').value = '';
    }

    // ページロード時に自動読み込み
    window.addEventListener('DOMContentLoaded', fetchAndRenderJSON);
  </script>
</body>
</html>
