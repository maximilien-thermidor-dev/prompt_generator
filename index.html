<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* アコーディオン開閉のトランジション補助 */
    details summary {
      cursor: pointer;
      user-select: none;
    }
    details summary::-webkit-details-marker {
      display: none;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans">

  <div class="max-w-6xl mx-auto px-4 py-8">
    <!-- ヘッダー -->
    <header class="mb-8 border-b pb-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
      <div>
        <h1 class="text-3xl font-bold text-slate-900 tracking-tight">Prompt Generator</h1>
        <p class="text-sm text-slate-500 mt-1">選択項目からAI画像・動画生成用のプロンプトを一括作成します。</p>
      </div>

      <!-- JSON取得先設定エリア -->
      <div class="w-full sm:w-auto flex flex-col gap-2">
        <div class="flex gap-2">
          <input 
            type="text" 
            id="jsonSourceInput" 
            value="./prompts.json" 
            placeholder="JSONのパスまたはRaw URL" 
            class="text-xs px-3 py-1.5 border rounded-lg bg-white w-64 focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
          <button 
            id="reloadJsonBtn" 
            class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-lg transition"
            title="最新のJSONを強制再読込"
          >
            🔄 再読込
          </button>
        </div>
        <span id="loadStatus" class="text-xs text-slate-500"></span>
      </div>
    </header>

    <!-- ローディング/エラー表示 -->
    <div id="statusMessage" class="hidden mb-6 p-4 rounded-xl border"></div>

    <main class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
      <!-- 左ペイン: カテゴリ選択エリア -->
      <section class="lg:col-span-7 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
        <div class="flex justify-between items-center mb-4 pb-2 border-b">
          <h2 class="text-xl font-bold text-slate-800">🔍 項目を選択</h2>
          <span id="selectionCountBadge" class="text-xs bg-blue-100 text-blue-800 font-semibold px-2.5 py-0.5 rounded-full">0個 選択中</span>
        </div>

        <div id="categoryContainer" class="space-y-4">
          <!-- JSでカテゴリツリーとPillボタンを動的生成 -->
        </div>
      </section>

      <!-- 右ペイン: 結果表示・操作エリア (スクロール追従) -->
      <section class="lg:col-span-5 sticky top-6 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col gap-4">
        <div class="flex justify-between items-center border-b pb-3">
          <h2 class="text-xl font-bold text-slate-800">📄 生成結果</h2>
        </div>

        <!-- アクションボタン群 -->
        <div class="grid grid-cols-3 gap-2">
          <button 
            id="generateBtn" 
            class="col-span-3 bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-bold py-2.5 px-4 rounded-xl shadow-sm transition flex items-center justify-center gap-2"
          >
            <span>🚀</span> プロンプトを作成する
          </button>
          <button 
            id="resetSelectionBtn" 
            class="col-span-2 bg-slate-100 hover:bg-slate-200 active:scale-[0.99] text-slate-700 text-sm font-medium py-2 px-3 rounded-xl transition"
          >
            ♻️ 選択を全解除
          </button>
          <button 
            id="clearOutputBtn" 
            class="bg-slate-100 hover:bg-slate-200 active:scale-[0.99] text-slate-700 text-sm font-medium py-2 px-3 rounded-xl transition"
          >
            🗑️ クリア
          </button>
        </div>

        <!-- 出力1: DomoAI -->
        <div class="flex flex-col gap-1.5 mt-2">
          <div class="flex justify-between items-center">
            <label for="outputDomo" class="text-xs font-bold text-slate-600">DomoAI Prompt</label>
            <button class="copy-btn text-xs text-blue-600 hover:text-blue-800" data-target="outputDomo">コピー</button>
          </div>
          <textarea 
            id="outputDomo" 
            rows="5" 
            readonly 
            placeholder="生成ボタンを押すとここに表示されます" 
            class="w-full text-xs font-mono p-3 bg-slate-50 border rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition resize-y"
          ></textarea>
        </div>

        <!-- 出力2: Gemini -->
        <div class="flex flex-col gap-1.5">
          <div class="flex justify-between items-center">
            <label for="outputGemini" class="text-xs font-bold text-slate-600">Gemini Prompt</label>
            <button class="copy-btn text-xs text-blue-600 hover:text-blue-800" data-target="outputGemini">コピー</button>
          </div>
          <textarea 
            id="outputGemini" 
            rows="5" 
            readonly 
            placeholder="生成ボタンを押すとここに表示されます" 
            class="w-full text-xs font-mono p-3 bg-slate-50 border rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition resize-y"
          ></textarea>
        </div>
      </section>
    </main>
  </div>

  <script>
    // --- 状態管理 ---
    let promptData = {};
    const selectedValues = new Set(); // 選択された value を保持 (順序保持・重複防止)

    // --- DOM要素 ---
    const categoryContainer = document.getElementById("categoryContainer");
    const jsonSourceInput = document.getElementById("jsonSourceInput");
    const reloadJsonBtn = document.getElementById("reloadJsonBtn");
    const loadStatus = document.getElementById("loadStatus");
    const statusMessage = document.getElementById("statusMessage");
    const selectionCountBadge = document.getElementById("selectionCountBadge");
    
    const generateBtn = document.getElementById("generateBtn");
    const resetSelectionBtn = document.getElementById("resetSelectionBtn");
    const clearOutputBtn = document.getElementById("clearOutputBtn");
    const outputDomo = document.getElementById("outputDomo");
    const outputGemini = document.getElementById("outputGemini");

    // --- JSON読み込み処理 ---
    async function loadPrompts(url) {
      showStatus("読み込み中...", "info");
      loadStatus.textContent = "取得中...";
      
      try {
        // GitHubキャッシュ対策: タイムスタンプクエリを付与して常に最新を取得
        const cacheBuster = (url.includes('?') ? '&' : '?') + '_t=' + Date.now();
        const response = await fetch(url + cacheBuster);
        
        if (!response.ok) {
          throw new Error(`HTTPエラー: ${response.status} (${response.statusText})`);
        }
        
        promptData = await response.json();
        hideStatus();
        loadStatus.textContent = "同期完了";
        renderCategoryTree(promptData);
      } catch (err) {
        console.error(err);
        showStatus(`JSONデータの取得に失敗しました: ${err.message}`, "error");
        loadStatus.textContent = "読み込みエラー";
        categoryContainer.innerHTML = "";
      }
    }

    // --- UIステータス表示 ---
    function showStatus(text, type) {
      statusMessage.classList.remove("hidden", "bg-red-50", "border-red-200", "text-red-700", "bg-blue-50", "border-blue-200", "text-blue-700");
      if (type === "error") {
        statusMessage.classList.add("bg-red-50", "border-red-200", "text-red-700");
      } else {
        statusMessage.classList.add("bg-blue-50", "border-blue-200", "text-blue-700");
      }
      statusMessage.textContent = text;
    }

    function hideStatus() {
      statusMessage.classList.add("hidden");
    }

    // --- カテゴリUIツリーの構築 ---
    function renderCategoryTree(data) {
      categoryContainer.innerHTML = "";

      // 大カテゴリ (Top)
      for (const [topCat, midData] of Object.entries(data)) {
        const topDetails = document.createElement("details");
        topDetails.className = "group border rounded-xl overflow-hidden bg-white shadow-xs";
        
        const topSummary = document.createElement("summary");
        topSummary.className = "flex justify-between items-center px-4 py-3 bg-slate-100 hover:bg-slate-200/80 font-bold text-slate-800 text-sm list-none transition cursor-pointer";
        topSummary.innerHTML = `
          <span>📂 ${escapeHtml(topCat)}</span>
          <span class="text-xs transition-transform group-open:rotate-180 text-slate-400">▼</span>
        `;
        topDetails.appendChild(topSummary);

        const topContent = document.createElement("div");
        topContent.className = "p-3 space-y-3 bg-slate-50/50";

        // 中カテゴリ (Mid)
        for (const [midCat, lowData] of Object.entries(midData)) {
          const midDetails = document.createElement("details");
          midDetails.className = "group/mid border border-slate-200 rounded-lg overflow-hidden bg-white";
          
          const midSummary = document.createElement("summary");
          midSummary.className = "flex justify-between items-center px-3 py-2 bg-slate-50 hover:bg-slate-100 font-semibold text-slate-700 text-xs list-none transition cursor-pointer";
          midSummary.innerHTML = `
            <span>🔹 ${escapeHtml(midCat)}</span>
            <span class="text-[10px] transition-transform group-open/mid:rotate-180 text-slate-400">▼</span>
          `;
          midDetails.appendChild(midSummary);

          const midContent = document.createElement("div");
          midContent.className = "p-3 space-y-3";

          // 小カテゴリ (Low)
          for (const [lowCat, items] of Object.entries(lowData)) {
            if (!items || items.length === 0) continue;

            const lowBlock = document.createElement("div");
            lowBlock.className = "flex flex-col gap-1.5";

            const lowTitle = document.createElement("span");
            lowTitle.className = "text-xs font-bold text-slate-600";
            lowTitle.textContent = lowCat;
            lowBlock.appendChild(lowTitle);

            // Pills (タグボタン群)
            const pillContainer = document.createElement("div");
            pillContainer.className = "flex flex-wrap gap-1.5";

            items.forEach(item => {
              const pill = document.createElement("button");
              pill.type = "button";
              pill.textContent = item.name;
              pill.dataset.value = item.value;
              pill.className = "pill-btn px-2.5 py-1 text-xs rounded-full border transition duration-150 ease-in-out select-none border-slate-300 text-slate-700 bg-white hover:border-blue-400";
              
              if (item.desc) {
                pill.title = item.desc;
              }

              pill.addEventListener("click", () => togglePill(pill, item.value));
              pillContainer.appendChild(pill);
            });

            lowBlock.appendChild(pillContainer);
            midContent.appendChild(lowBlock);
          }

          midDetails.appendChild(midContent);
          topContent.appendChild(midDetails);
        }

        topDetails.appendChild(topContent);
        categoryContainer.appendChild(topDetails);
      }
    }

    // --- ピル選択切り替え ---
    function togglePill(btn, value) {
      if (selectedValues.has(value)) {
        selectedValues.delete(value);
        btn.classList.remove("bg-blue-600", "text-white", "border-blue-600", "font-medium");
        btn.classList.add("bg-white", "text-slate-700", "border-slate-300");
      } else {
        selectedValues.add(value);
        btn.classList.add("bg-blue-600", "text-white", "border-blue-600", "font-medium");
        btn.classList.remove("bg-white", "text-slate-700", "border-slate-300");
      }
      updateBadge();
    }

    // --- バッジ更新 ---
    function updateBadge() {
      selectionCountBadge.textContent = `${selectedValues.size}個 選択中`;
    }

    // --- プロンプト生成 ---
    generateBtn.addEventListener("click", () => {
      const combined = Array.from(selectedValues).join("");
      const prefix = "かわいいアニメイラスト. 9:16, ";

      outputDomo.value = combined;
      outputGemini.value = combined ? `${prefix}${combined}` : "";
    });

    // --- 選択リセット ---
    resetSelectionBtn.addEventListener("click", () => {
      selectedValues.clear();
      document.querySelectorAll(".pill-btn").forEach(btn => {
        btn.classList.remove("bg-blue-600", "text-white", "border-blue-600", "font-medium");
        btn.classList.add("bg-white", "text-slate-700", "border-slate-300");
      });
      updateBadge();
    });

    // --- 出力クリア ---
    clearOutputBtn.addEventListener("click", () => {
      outputDomo.value = "";
      outputGemini.value = "";
    });

    // --- クリップボードコピー機能 ---
    document.querySelectorAll(".copy-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const targetId = btn.dataset.target;
        const targetInput = document.getElementById(targetId);
        if (!targetInput.value) return;

        navigator.clipboard.writeText(targetInput.value).then(() => {
          const original = btn.textContent;
          btn.textContent = "完了!";
          btn.classList.add("text-green-600");
          setTimeout(() => {
            btn.textContent = original;
            btn.classList.remove("text-green-600");
          }, 1500);
        });
      });
    });

    // --- JSONソース変更 / 再読み込み ---
    reloadJsonBtn.addEventListener("click", () => {
      const url = jsonSourceInput.value.trim();
      if (url) {
        loadPrompts(url);
      }
    });

    // --- エスケープ処理 ---
    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // --- 初期ロード ---
    window.addEventListener("DOMContentLoaded", () => {
      loadPrompts(jsonSourceInput.value.trim());
    });
  </script>
</body>
</html>
